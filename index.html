<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0f8fc">
<meta name="description" content="JOL Fitness — ИИ-тренер, тренировки дома и подсчёт калорий и БЖУ по фото еды.">
<title>JOL Fitness — твоя активность за день</title>
<link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="cup" viewBox="0 0 35 43">
      <path fill="currentColor" d="M3.2 1.5h28.6a2 2 0 0 1 2 2.2l-3.4 34.6a4 4 0 0 1-4 3.7H8.6a4 4 0 0 1-4-3.7L1.2 3.7a2 2 0 0 1 2-2.2Z"/>
    </symbol>
  </defs>
</svg>

<div class="boot" id="boot" aria-hidden="true"></div>

<div class="app">
  <aside class="rail" aria-label="Главное меню">
    <div class="rail-top">
      <svg class="logo" id="logo" viewBox="0 0 45 45" role="img" aria-label="JOL Fitness"></svg>
      <nav class="nav">
        <button class="nav-b" data-go="home" aria-label="Главная"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.6 2.6a2.2 2.2 0 0 1 2.8 0l7.2 6a2.2 2.2 0 0 1 .8 1.7v9.2A2.5 2.5 0 0 1 18.9 22H5.1a2.5 2.5 0 0 1-2.5-2.5v-9.2c0-.7.3-1.3.8-1.7l7.2-6Z"/><circle class="hole" cx="12" cy="14.6" r="2.4"/></svg><span class="nav-label">Главная</span><span class="tip">Главная</span></button>
        <button class="nav-b" data-go="workouts" aria-label="Тренировки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><polyline points="7 14.5 10 11 13 13.5 17 9"/></svg><span class="nav-label">Тренировки</span><span class="tip">Тренировки</span></button>
        <button class="nav-b" data-go="food" aria-label="Питание"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7.5c-1.4-1-3.6-1.6-5.4-.6C4.2 8.3 3.8 12 5 15.3c1.1 3 3 5.4 5 5.2 1 0 1.2-.5 2-.5s1 .5 2 .5c2 .2 3.9-2.2 5-5.2 1.2-3.3.8-7-1.6-8.4-1.8-1-4-.4-5.4.6Z"/><path d="M12 7.5c0-2 1-3.6 3-4.5"/></svg><span class="nav-label">Питание</span><span class="tip">Питание и сканер</span></button>
        <button class="nav-b" data-go="coach" aria-label="ИИ-тренер"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.6c0 4.4-3.8 8-8.5 8-1.3 0-2.5-.3-3.6-.7L3.5 20.5l1.4-4A7.6 7.6 0 0 1 3.5 11.6c0-4.4 3.8-8 8.5-8s8.5 3.6 8.5 8Z"/><path d="M9 11.8h6"/></svg><span class="nav-label">ИИ-тренер</span><span class="tip">ИИ-тренер</span></button>
        <span class="nav-rule" aria-hidden="true"></span>
        <button class="nav-b" data-go="progress" aria-label="Прогресс" data-more><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 20.5h17"/><path d="M4 16l4.5-5 4 3 7-8"/><polyline points="15 6 19.5 6 19.5 10.5"/></svg><span class="nav-label">Прогресс</span><span class="tip">Прогресс</span></button>
        <button class="nav-b" data-go="reminders" aria-label="Напоминания" data-more><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15.5 6 9.5Z"/><path d="M10.2 20.5a2 2 0 0 0 3.6 0"/></svg><span class="nav-label">Напоминания</span><span class="tip">Напоминания</span></button>
      </nav>
    </div>
    <div class="rail-foot">
      <button class="nav-b" data-go="profile" aria-label="Настройки" data-more><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg><span class="nav-label">Профиль</span><span class="tip">Профиль и настройки</span></button>
      <button class="nav-b" data-go="help" aria-label="Помощь" data-more><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.7-2.5 2.4-2.5 2.4"/><line x1="12" y1="16.6" x2="12" y2="16.7"/></svg><span class="nav-label">Помощь</span><span class="tip">Помощь</span></button>
      <button class="nav-b nav-b--menu" aria-label="Меню" aria-expanded="false" data-menu><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg><span class="nav-label">Меню</span></button>
      <button class="profile" data-go="profile" aria-label="Профиль" id="rail-ava"></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar" id="top"></header>
    <div class="view" id="view"></div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/reminders.js"></script>
<script src="js/native.js"></script>
<script src="js/app.js"></script>
</body>
</html>
